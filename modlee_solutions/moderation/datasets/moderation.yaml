reviews:
  # Positive Reviews
  - text: "The QuickHeat Space Heater keeps my entire room warm in seconds! Perfect for winter nights."
    label: "positive"
  - text: "The PowerMax Portable Charger saved me on my trip! Charges my phone super fast and lasts all day!"
    label: "positive"
  - text: "The GlowNest Smart Lamp has the perfect brightness and looks great in my bedroom. Love it!"
    label: "positive"
  - text: "The FitTrack Smart Scale is super accurate and syncs perfectly with my fitness app. Highly recommend!"
    label: "positive"
  - text: "The SonicFlow Hair Dryer is a game-changer! My hair dries in half the time and looks great!"
    label: "positive"
  - text: "The CleanBreeze Air Purifier has noticeably improved my allergies. The air feels fresher and cleaner!"
    label: "positive"
  - text: "The AutoChef Air Fryer makes the crispiest fries! So easy to use and clean!"
    label: "positive"
  - text: "The PureVision Security Camera has crystal clear video, and the night vision works perfectly!"
    label: "positive"
  - text: "The SilentClick Wireless Mouse is smooth and actually silent. No more annoying clicks!"
    label: "positive"
  - text: "The UltraFit Running Shoes are lightweight and super comfortable. Best running shoes I've ever owned!"
    label: "positive"
  - text: "The NovaSteam Iron removes wrinkles in seconds and heats up super fast. Amazing quality!"
    label: "positive"
  - text: "The HyperSound Bluetooth Speaker delivers deep bass and crystal-clear audio. Love it!"
    label: "positive"
  - text: "The DeepRest Memory Foam Mattress is the most comfortable bed ever! I wake up feeling refreshed!"
    label: "positive"
  - text: "The FlexBend Yoga Mat has the perfect grip and thickness. My workouts feel so much better!"
    label: "positive"
  - text: "The SnapCharge Wireless Charger is compact and works fast. Super convenient for travel!"
    label: "positive"
  - text: "The InstaGrill BBQ Smoker makes the juiciest meat! The smoke control is perfect!"
    label: "positive"
  - text: "The ViewPro 4K Monitor has incredible colors and a sharp display. Perfect for gaming and work!"
    label: "positive"
  - text: "The SleepEase Weighted Blanket is so relaxing. I sleep deeper and feel more rested!"
    label: "positive"
  - text: "The BreezeCool Ceiling Fan is whisper-quiet and moves air perfectly. Great addition to my home!"
    label: "positive"
  - text: "The PureTone Earbuds have excellent noise cancellation and deep bass. Love these!"
    label: "positive"

  # Negative Reviews
  - text: "The QuickHeat Space Heater barely produces heat. Waste of money!"
    label: "negative"
  - text: "The PowerMax Portable Charger is slow and dies way too fast. Useless!"
    label: "negative"
  - text: "The GlowNest Smart Lamp flickers nonstop. Gave me a headache within minutes!"
    label: "negative"
  - text: "The FitTrack Smart Scale shows a different weight every time I step on it. Completely inaccurate!"
    label: "negative"
  - text: "The SonicFlow Hair Dryer overheats and smells like burning plastic. Dangerous!"
    label: "negative"
  - text: "The CleanBreeze Air Purifier makes a ton of noise but does nothing for air quality!"
    label: "negative"
  - text: "The AutoChef Air Fryer burns everything, even at the lowest setting. Terrible product!"
    label: "negative"
  - text: "The PureVision Security Camera disconnects constantly. I can't rely on it at all!"
    label: "negative"
  - text: "The SilentClick Wireless Mouse started lagging after a week. Frustrating to use!"
    label: "negative"
  - text: "The UltraFit Running Shoes fell apart after a few runs. Absolute junk!"
    label: "negative"
  - text: "The NovaSteam Iron leaks water all over my clothes. Completely useless!"
    label: "negative"
  - text: "The HyperSound Bluetooth Speaker crackles and cuts out constantly. So annoying!"
    label: "negative"
  - text: "The DeepRest Memory Foam Mattress is rock hard. I wake up feeling worse than when I went to sleep!"
    label: "negative"
  - text: "The FlexBend Yoga Mat is too thin and falls apart after a few uses!"
    label: "negative"
  - text: "The SnapCharge Wireless Charger takes forever to charge my phone. Total rip-off!"
    label: "negative"
  - text: "The InstaGrill BBQ Smoker is impossible to clean and doesn’t cook evenly!"
    label: "negative"
  - text: "The ViewPro 4K Monitor has washed-out colors and terrible brightness!"
    label: "negative"
  - text: "The SleepEase Weighted Blanket is way too heavy. It feels suffocating!"
    label: "negative"
  - text: "The BreezeCool Ceiling Fan makes a horrible clicking noise. So distracting!"
    label: "negative"
  - text: "The PureTone Earbuds stopped working in a month. Cheap junk!"
    label: "negative"

